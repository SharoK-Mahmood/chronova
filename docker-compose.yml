services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: chronova
    ports:
      - "5432:5432"
    volumes:
      - chronova_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d chronova"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  chronova_pgdata:
